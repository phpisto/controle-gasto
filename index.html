<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="Controle pessoal de receitas, despesas, cartão e investimento Toke.">
<title>Controle de gastos</title>
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#1E2B3A; --muted:#667382; --line:#D8E0DC;
  --accent:#1F6F78; --accent-soft:#DCEDEE; --pos:#2E7D4F; --neg:#B23A48; --card:#7A4FA0; --card-soft:#EEE6F5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --surface:#19212B; --sunk:#151C24; --ink:#E6ECF2; --muted:#93A1B0; --line:#2A3542;
    --accent:#5FB7BE; --accent-soft:#1E3437; --pos:#6CC28F; --neg:#E47682; --card:#B993DB; --card-soft:#2B2338;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212B; --sunk:#151C24; --ink:#E6ECF2; --muted:#93A1B0; --line:#2A3542;
  --accent:#5FB7BE; --accent-soft:#1E3437; --pos:#6CC28F; --neg:#E47682; --card:#B993DB; --card-soft:#2B2338;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.install{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer}
.install:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){.install{padding:8px 10px}}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0d1a1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0d1a1c}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Faixa de meses */
.ribbon{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.mcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mcol[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mcol .nm{font-weight:700}
.bar{position:relative;flex:1;min-height:56px}
.bar::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.bar i{position:absolute;left:0;right:0;border-radius:4px}
.mcol .res{font-weight:700;font-size:1.05rem;white-space:nowrap}
.kpi b{white-space:nowrap}
.mcol .sub{font-size:.78rem;color:var(--muted)}
.mcol.add{align-items:center;justify-content:center;border-style:dashed;color:var(--accent);font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.acc{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:-6px 0 18px;color:var(--muted);font-size:.9rem}
.acc b{color:var(--ink)}

/* Mês */
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.mhead h2{font-size:2rem;margin:0;letter-spacing:-.02em;line-height:1.1}
.mhead h2 input{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dashed transparent;width:auto;max-width:100%;padding:0}
.mhead h2 input:hover,.mhead h2 input:focus{border-bottom-color:var(--line)}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi span{display:block;font-size:.8rem;color:var(--muted)}
.kpi b{font-size:1.25rem}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
section.panel h3{margin:0 0 12px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section.panel h3 small{font-weight:500;color:var(--muted);font-size:.82rem}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
input.num,input.txt{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input.num{text-align:right}
.calc{margin:12px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.row span{color:var(--muted)}
.row.strong{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.row.strong span{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:6px;align-items:center}
.sublabel{font-size:.8rem;color:var(--muted);margin:14px 0 2px}
.icon{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:8px;font-size:1.1rem;line-height:1}
.icon:hover{background:var(--sunk);color:var(--neg)}
.addbtn{margin-top:8px;border:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-weight:600;border-radius:8px;padding:7px 10px;cursor:pointer;width:100%}
.addbtn:hover{background:var(--accent-soft)}

/* Tabela de despesas */
.dtable{width:100%;border-collapse:collapse}
.dwrap{overflow-x:auto}
.dtable th{font-size:.75rem;font-weight:600;color:var(--muted);text-align:left;padding:0 4px 6px}
.dtable th.r{text-align:right}
.dtable td{padding:3px 4px;vertical-align:middle}
.dtable tr.paid td:not(:first-child):not(:last-child){opacity:.55}
.dtable td.tot{text-align:right;font-weight:600;white-space:nowrap;min-width:92px}
.dtable input.txt{min-width:120px}
.dtable input.qty{width:56px}
.dtable input.val{width:96px}
.chk{width:18px;height:18px;accent-color:var(--pos);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sunk);color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:6px 9px;cursor:pointer}
.seg button.on-conta{background:var(--accent-soft);color:var(--accent)}
.seg button.on-cartao{background:var(--card-soft);color:var(--card)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.close{margin-top:14px;background:var(--sunk);border-radius:10px;padding:12px}
.close .row{align-items:center}
.close label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.mactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:8px;padding:7px 12px;cursor:pointer}
.ghost.danger{color:var(--neg)}
.ghost:hover{border-color:var(--accent)}

/* Toke */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tnote{color:var(--muted);font-size:.85rem;margin:0 0 14px;max-width:70ch}
.big{font-size:1.6rem;font-weight:700;margin:4px 0 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* ---------- iPhone ---------- */
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@media (max-width:640px){
  .wrap{padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  header.top .tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;justify-content:stretch;box-shadow:0 6px 24px rgba(20,30,40,.18);border-radius:14px;padding:5px}
  header.top .tabs button{flex:1;padding:11px 8px;border-radius:10px}
  input.num,input.txt{font-size:16px;padding:9px 10px}
  .mhead h2{font-size:1.7rem}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;width:100%}
  .kpi.res-kpi{grid-column:1/-1}
  .ribbon{grid-auto-columns:minmax(132px,40%);scroll-snap-type:x mandatory;padding:2px 2px 6px}
  .mcol{scroll-snap-align:start;min-height:138px}
  section.panel{padding:14px 12px;border-radius:16px}
  .dwrap{overflow:visible}
  .dtable,.dtable tbody{display:block}
  .dtable thead{display:none}
  .dtable tr{display:grid;grid-template-columns:30px 64px minmax(0,1fr) auto 34px;grid-template-areas:"chk nome nome tot del" ". qtd val onde onde";gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .dtable tr:last-child{border-bottom:0}
  .dtable td{padding:0;display:block}
  .dtable td:nth-child(1){grid-area:chk}
  .dtable td:nth-child(2){grid-area:nome}
  .dtable td:nth-child(3){grid-area:qtd}
  .dtable td:nth-child(4){grid-area:val}
  .dtable td:nth-child(5){grid-area:onde;justify-self:end}
  .dtable td:nth-child(6){grid-area:tot;min-width:0}
  .dtable td:nth-child(7){grid-area:del}
  .dtable input.txt{min-width:0}
  .dtable input.qty,.dtable input.val{width:100%}
  .seg button{padding:9px 10px;font-size:.85rem}
  .chk{width:22px;height:22px}
  .icon{width:34px;height:34px}
  .li{grid-template-columns:minmax(0,1fr) 110px 34px}
  .mactions .ghost{flex:1;padding:10px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Controle de gastos</h1>
      <div class="sync" id="sync">Carregando…</div>
    </div>
    <button class="install" id="installApp" type="button">Instalar app</button>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-meses" aria-selected="true">Meses</button>
      <button role="tab" id="tab-toke" aria-selected="false">Investimento Toke</button>
    </div>
  </header>

  <main id="view-meses">
    <div class="ribbon" id="ribbon"></div>
    <div class="acc" id="acc"></div>
    <div id="month"></div>
  </main>

  <main id="view-toke" class="hidden"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Dados da planilha "trabalho.xlsx" ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
function D(nome, valor, tipo, qtd) { return { id: uid(), nome, qtd: qtd ?? null, valor, tipo, pago: false }; }
const INITIAL = {
  v: 1,
  meses: [
    {
      id: uid(), nome: "Outubro",
      sal: { base: 2350, inssPct: 9, horasFalt: 5, valorHora: 10.68, valeDia: 23, diasUteis: 21 },
      outras: [{ id: uid(), nome: "Mãe", valor: 2000 }, { id: uid(), nome: "Dinheiro", valor: 161 }],
      despesas: [
        D("Lote", 1004, "conta"), D("IPTU", 296, "conta"), D("Fiés", 320, "conta"), D("Luz", 210, "cartao"),
        D("Água", 68, "cartao"), D("Internet", 99, "conta"), D("Marmita", 26, "conta", 5), D("Faculdade", 344, "cartao"),
        D("Carona", 276, "conta"), D("Mel", 40, "conta"), D("Limpeza Lote", 0, "conta"), D("Spotify", 31.9, "cartao"),
        D("Apple", 19.9, "cartao"), D("Ifood", 7.95, "cartao"), D("Vivo", 72.42, "cartao"), D("Gasolina", 380, "cartao"),
        D("Chat", 13, "conta", 2), D("Claro", 33.9, "conta"), D("Barbeiro", 89.9, "cartao")
      ],
      fech: { cartaoMes: false, cartaoAnt: false, extras: [{ id: uid(), nome: "Cartão", valor: 2766.41 }] }
    },
    {
      id: uid(), nome: "Novembro",
      sal: { base: 2350, inssPct: 9, horasFalt: 0, valorHora: 10.68, valeDia: 23, diasUteis: 21 },
      outras: [{ id: uid(), nome: "Mãe", valor: 2000 }, { id: uid(), nome: "Dinheiro", valor: 75 }, { id: uid(), nome: "13° 1ª", valor: 587.5 }],
      despesas: [
        D("Lote", 1004, "conta"), D("IPTU", 296, "conta"), D("Fiés", 320, "conta"), D("Luz", 210, "conta"),
        D("Água", 68, "conta"), D("Internet", 99, "conta"), D("Marmita", 26, "conta", 5), D("Faculdade", 344, "conta"),
        D("Carona", 250, "conta"), D("Mel", 40, "conta"), D("Limpeza Lote", 0, "conta"), D("Spotify", 31.9, "cartao"),
        D("Apple", 19.9, "cartao"), D("Ifood", 7.95, "cartao"), D("Vivo", 72.42, "cartao"), D("Gasolina", 380, "cartao"),
        D("Chat", 13, "conta", 2), D("Claro", 33.9, "conta"), D("Barbeiro", 89.9, "cartao")
      ],
      fech: { cartaoMes: true, cartaoAnt: true, extras: [] }
    },
    {
      id: uid(), nome: "Dezembro",
      sal: { base: 2350, inssPct: 9, horasFalt: 0, valorHora: 10.68, valeDia: 23, diasUteis: 21 },
      outras: [{ id: uid(), nome: "Mãe", valor: 2000 }, { id: uid(), nome: "Dinheiro", valor: 75 }, { id: uid(), nome: "13° 2ª", valor: 499.37 }],
      despesas: [
        D("Lote", 1004, "conta"), D("IPTU", 296, "conta"), D("Fiés", 320, "conta"), D("Luz", 210, "conta"),
        D("Água", 68, "conta"), D("Internet", 99, "conta"), D("Marmita", 26, "conta", 5), D("Faculdade", 344, "conta"),
        D("Carona", 250, "conta"), D("Mel", 40, "conta"), D("Limpeza Lote", 120, "conta"), D("Spotify", 31.9, "cartao"),
        D("Apple", 19.9, "cartao"), D("Ifood", 7.95, "cartao"), D("Vivo", 72.42, "cartao"), D("Gasolina", 380, "cartao"),
        D("Chat", 13, "conta", 2), D("Claro", 33.9, "conta"), D("Barbeiro", 89.9, "cartao")
      ],
      fech: { cartaoMes: true, cartaoAnt: false, extras: [] }
    }
  ],
  toke: { precoCompra: 0.0027, cotacaoCompra: 5.4, cotacaoHoje: 5.16, totalSacado: 362195.7, totalBloq: 37976.3,
          precoAtual: 0.00004692, totalCorretora: 362110.7, taxaSaque: 132101.63 }
};

/* ---------- Estado ---------- */
let state = structuredClone(INITIAL);
let sel = 0;
let db = null, docRef = null, lastRev = null, saveTimer = null, saving = false, pendingSave = false;
const LS_KEY = "controle-gastos-v1";
try { const s = localStorage.getItem(LS_KEY); if (s) { const p = JSON.parse(s); if (p && p.meses) state = p; } } catch (e) {}

/* ---------- Formatação ---------- */
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const usd = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
const nf = (d) => new Intl.NumberFormat("pt-BR", { maximumFractionDigits: d });
const R = (v) => brl.format(v || 0);
const n = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/\s|R\$|\$/g, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const v = Number(s);
  return isFinite(v) ? v : null;
}
const fmtIn = (v, d = 2) => (v == null || v === "" ? "" : nf(d).format(v));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Cálculos (mesmas fórmulas da planilha) ---------- */
function calcMes(i) {
  const m = state.meses[i];
  const s = m.sal;
  const inss = n(s.base) * n(s.inssPct) / 100;
  const faltas = n(s.valorHora) * n(s.horasFalt);
  const vale = n(s.diasUteis) * n(s.valeDia);
  const liquido = n(s.base) - inss - faltas + vale;
  const outras = m.outras.reduce((a, o) => a + n(o.valor), 0);
  const receitas = liquido + outras;
  const tot = (d) => (d.qtd != null ? n(d.qtd) * n(d.valor) : n(d.valor));
  const conta = m.despesas.filter(d => d.tipo === "conta").reduce((a, d) => a + tot(d), 0);
  const cartao = m.despesas.filter(d => d.tipo === "cartao").reduce((a, d) => a + tot(d), 0);
  const prevCartao = i > 0 ? calcCartao(i - 1) : 0;
  const extras = m.fech.extras.reduce((a, e) => a + n(e.valor), 0);
  const despesas = conta + (m.fech.cartaoMes ? cartao : 0) + (m.fech.cartaoAnt ? prevCartao : 0) + extras;
  const totalItens = m.despesas.reduce((a, d) => a + tot(d), 0);
  const pagos = m.despesas.filter(d => d.pago).reduce((a, d) => a + tot(d), 0);
  return { inss, faltas, vale, liquido, outras, receitas, conta, cartao, prevCartao, extras, despesas,
           resultado: receitas - despesas, tot, totalItens, pagos };
}
function calcCartao(i) {
  const m = state.meses[i];
  return m.despesas.filter(d => d.tipo === "cartao").reduce((a, d) => a + (d.qtd != null ? n(d.qtd) * n(d.valor) : n(d.valor)), 0);
}
function calcToke() {
  const t = state.toke;
  const qtd = n(t.totalSacado) + n(t.totalBloq);            // Total ativo = Quantidade
  const compraUSD = qtd * n(t.precoCompra);                  // Compra total $
  const custoCompra = compraUSD * n(t.cotacaoCompra);
  const custoHoje = compraUSD * n(t.cotacaoHoje);
  const correcao = custoCompra - custoHoje;
  const diferenca = n(t.totalSacado) - n(t.totalCorretora);
  const perdasTok = diferenca + n(t.taxaSaque);
  const perdasUSD = -(perdasTok * n(t.precoCompra));
  const perdasBRL = perdasUSD * n(t.cotacaoCompra);
  const mercadoParcial = n(t.precoAtual) * (n(t.totalCorretora) - perdasTok);
  const valorMercado = n(t.precoAtual) * qtd;
  const resultado = valorMercado - (compraUSD - perdasBRL);
  const resultado2 = resultado * n(t.cotacaoHoje);
  const pct = compraUSD ? perdasUSD / compraUSD : 0;
  return { qtd, compraUSD, custoCompra, custoHoje, correcao, diferenca, perdasTok, perdasUSD, perdasBRL,
           mercadoParcial, valorMercado, resultado, resultado2, pct };
}

/* ---------- Render: faixa de meses ---------- */
function renderRibbon() {
  const calcs = state.meses.map((_, i) => calcMes(i));
  const max = Math.max(1, ...calcs.map(c => Math.abs(c.resultado)));
  const el = document.getElementById("ribbon");
  el.innerHTML = calcs.map((c, i) => {
    const h = Math.max(3, Math.abs(c.resultado) / max * 50);
    const pos = c.resultado >= 0;
    const style = pos ? `bottom:50%;height:${h}%;background:var(--pos)` : `top:50%;height:${h}%;background:var(--neg)`;
    return `<button class="mcol" data-sel="${i}" aria-current="${i === sel}">
      <span class="nm">${esc(state.meses[i].nome)}</span>
      <span class="bar" aria-hidden="true"><i style="${style};opacity:.85"></i></span>
      <span class="res ${pos ? "pos" : "neg"}">${R(c.resultado)}</span>
      <span class="sub">Entra ${R(c.receitas)}<br>Sai ${R(c.despesas)}</span>
    </button>`;
  }).join("") + `<button class="mcol add" id="addMonth">+ Novo mês<br><span class="sub">copia o último</span></button>`;
  const acum = calcs.reduce((a, c) => a + c.resultado, 0);
  document.getElementById("acc").innerHTML =
    `<span>Saldo acumulado de ${esc(state.meses[0]?.nome || "")} a ${esc(state.meses.at(-1)?.nome || "")}: <b class="${acum >= 0 ? "pos" : "neg"}">${R(acum)}</b></span>
     <span>Tocar em um mês abre os detalhes</span>`;
}

/* ---------- Render: mês ---------- */
function renderMonth() {
  const m = state.meses[sel];

      <div class="dwrap"><table class="dtable">
        <thead><tr><th title="Marque quando pagar">Pago</th><th>Descrição</th><th class="r">Qtd</th><th class="r">Valor</th><th>Onde</th><th class="r">Total</th><th></th></tr></thead>

      <button class="addbtn" id="addDesp">+ Adicionar despesa</button>

      <div class="close">
        <div class="row"><span>Total contas</span><b data-o="conta">${R(c.conta)}</b></div>

        ${prevName ? `<div class="row"><label><input type="checkbox" class="chk" id="fCartaoAnt" ${m.fech.cartaoAnt ? "checked" : ""}> Cartão de ${esc(prevName)} (mês anterior)</label><b>${R(c.prevCartao)}</b></div>` : ""}
        <div class="sublabel">Outros lançamentos</div>
        <div class="list">
          ${m.fech.extras.map(e => `<div class="li">
            <input class="txt" data-extra="${e.id}" data-k="nome" value="${esc(e.nome)}" aria-label="Descrição">
            <input class="num" inputmode="decimal" data-extra="${e.id}" data-k="valor" value="${fmtIn(e.valor)}" aria-label="Valor">
            <button class="icon" data-del-extra="${e.id}" aria-label="Remover ${esc(e.nome)}">×</button></div>`).join("")}
        </div>
        <button class="addbtn" id="addExtra">+ Adicionar lançamento (ex.: fatura avulsa)</button>
        <div class="row strong"><span>Total despesas</span><b data-o="despesas2">${R(c.despesas)}</b></div>
      </div>
    </section>
  </div>
  <div class="mactions">
    <button class="ghost" id="dupMonth">Duplicar ${esc(m.nome)}</button>
    <button class="ghost" id="resetPago">Desmarcar pagos</button>
    <button class="ghost danger" id="delMonth">Excluir ${esc(m.nome)}</button>
  </div>`;
}

function refreshNumbers() {
  const c = calcMes(sel);
  const set = (k, v, cls) => document.querySelectorAll(`[data-o="${k}"]`).forEach(e => { e.textContent = v; if (cls) e.className = cls; });
  set("receitas", R(c.receitas)); set("receitas2", R(c.receitas)); set("receitas3", R(c.receitas));
  set("despesas", R(c.despesas)); set("despesas2", R(c.despesas));
  set("resultado", R(c.resultado), c.resultado >= 0 ? "pos" : "neg");
  set("inss", "− " + R(c.inss)); set("faltas", "− " + R(c.faltas)); set("vale", "+ " + R(c.vale)); set("liquido", R(c.liquido));
  set("conta", R(c.conta)); set("cartao", R(c.cartao));
  set("pagoInfo", `Pago ${R(c.pagos)} de ${R(c.totalItens)}`);
  state.meses[sel].despesas.forEach(d => { const e = document.querySelector(`[data-dt="${d.id}"]`); if (e) e.textContent = R(c.tot(d)); });
  renderRibbon();
}

/* ---------- Persistência ---------- */
function setSync(t) { document.getElementById("sync").textContent = t; }
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!docRef) { setSync("Salvo neste navegador"); return; }
  clearTimeout(saveTimer);
  setSync("Salvando…");
  saveTimer = setTimeout(flush, 700);
}
async function flush() {
  if (saving) { pendingSave = true; return; }
  saving = true;
  lastRev = uid();
  try { await docRef.set({ ...structuredClone(state), rev: lastRev }); setSync("Salvo na sua conta"); }
  catch (e) {
    if (e && e.code === "unavailable") { setTimeout(flush, 1500 + Math.random() * 1000); }
    else setSync("Não foi possível salvar na conta; salvo neste navegador");
  }
  saving = false;
  if (pendingSave) { pendingSave = false; flush(); }
}
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 1800); }

async function connect() {
  if (!window.claude || !window.claude.use) { setSync("Salvo neste navegador"); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = u ? await u.id() : null;
    if (!d || !id) { setSync("Salvo neste navegador"); return; }
    db = d; docRef = db.doc("data/users/" + id + "/financas");
    docRef.onSnapshot(snap => {
      if (!snap.exists) { setSync("Salvo neste navegador (sincroniza na primeira edição)"); return; }
      const data = snap.data();
      if (data.rev && data.rev === lastRev) { setSync("Salvo na sua conta"); return; }
      if (!data.meses) return;
      const active = document.activeElement;
      if (active && active.matches && active.matches("input.num,input.txt")) { pendingRemote = data; return; }
      applyRemote(data);
    }, () => setSync("Salvo neste navegador"));
  } catch (e) { setSync("Salvo neste navegador"); }
}
let pendingRemote = null;
function applyRemote(data) {
  const { rev, ...rest } = structuredClone(data);
  lastRev = rev; state = rest;
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (sel >= state.meses.length) sel = Math.max(0, state.meses.length - 1);
  renderAll(); setSync("Salvo na sua conta");
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (pendingRemote && !(document.activeElement && document.activeElement.matches("input.num,input.txt"))) { const p = pendingRemote; pendingRemote = null; applyRemote(p); }
}, 0));

/* ---------- Eventos ---------- */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function nextName(nome) {
  const i = MESES.findIndex(x => x.toLowerCase() === String(nome).trim().toLowerCase());
  return i >= 0 ? MESES[(i + 1) % 12] : "Novo mês";
}
function cloneMonth(m, nome) {
  const c = structuredClone(m);
  c.id = uid(); c.nome = nome;
  c.despesas.forEach(d => { d.id = uid(); d.pago = false; });
  c.outras.forEach(o => o.id = uid());
  c.fech = { cartaoMes: m.fech.cartaoMes, cartaoAnt: false, extras: [] };
  return c;
}
const find = (arr, id) => arr.find(x => x.id === id);

document.addEventListener("input", (e) => {
  const t = e.target, m = state.meses[sel];
  if (t.dataset.sal) { m.sal[t.dataset.sal] = parseNum(t.value); }
  else if (t.dataset.outra) { const o = find(m.outras, t.dataset.outra); o[t.dataset.k] = t.dataset.k === "nome" ? t.value : parseNum(t.value); }
  else if (t.dataset.desp) { const d = find(m.despesas, t.dataset.desp); d[t.dataset.k] = t.dataset.k === "nome" ? t.value : parseNum(t.value); }
  else if (t.dataset.extra) { const x = find(m.fech.extras, t.dataset.extra); x[t.dataset.k] = t.dataset.k === "nome" ? t.value : parseNum(t.value); }
  else if (t.id === "mname") { m.nome = t.value; t.size = Math.max(4, t.value.length); }
  else if (t.dataset.toke) { state.toke[t.dataset.toke] = parseNum(t.value); persist(); return; }
  else return;
  refreshNumbers(); persist();
});
document.addEventListener("change", (e) => {
  const t = e.target, m = state.meses[sel];
  if (t.dataset.pago) { find(m.despesas, t.dataset.pago).pago = t.checked; renderMonth(); refreshNumbers(); persist(); return; }
  if (t.id === "fCartaoMes") { m.fech.cartaoMes = t.checked; refreshNumbers(); renderMonth(); persist(); return; }
  if (t.id === "fCartaoAnt") { m.fech.cartaoAnt = t.checked; refreshNumbers(); renderMonth(); persist(); return; }
  if (t.dataset.toke) { renderToke(); return; }
  if (t.matches("input.num")) { renderMonth(); renderRibbon(); }
  if (t.id === "mname") { renderAll(); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const m = state.meses[sel];
  if (b.dataset.sel != null) { sel = +b.dataset.sel; renderAll(); return; }
  if (b.id === "addMonth") {
    const last = state.meses.at(-1);
    state.meses.push(last ? cloneMonth(last, nextName(last.nome)) : structuredClone(INITIAL.meses[0]));
    sel = state.meses.length - 1; renderAll(); persist(); toast("Mês criado a partir de " + (last ? last.nome : "Outubro")); return;
  }
  if (b.id === "dupMonth") {
    state.meses.splice(sel + 1, 0, cloneMonth(m, m.nome + " (cópia)")); sel++; renderAll(); persist(); toast("Mês duplicado"); return;
  }
  if (b.id === "delMonth") {
    if (!confirm(`Excluir ${m.nome}? Isso não pode ser desfeito.`)) return;
    state.meses.splice(sel, 1); sel = Math.max(0, sel - 1); renderAll(); persist(); toast("Mês excluído"); return;
  }
  if (b.id === "resetPago") { m.despesas.forEach(d => d.pago = false); renderAll(); persist(); return; }
  if (b.id === "addOutra") { m.outras.push({ id: uid(), nome: "", valor: null }); renderMonth(); focusLast("[data-outra][data-k=nome]"); persist(); return; }
  if (b.id === "addDesp") { m.despesas.push(D("", null, "conta")); renderMonth(); focusLast("[data-desp][data-k=nome]"); persist(); return; }
  if (b.id === "addExtra") { m.fech.extras.push({ id: uid(), nome: "", valor: null }); renderMonth(); focusLast("[data-extra][data-k=nome]"); persist(); return; }
  if (b.dataset.delOutra) { m.outras = m.outras.filter(o => o.id !== b.dataset.delOutra); renderAll(); persist(); return; }
  if (b.dataset.delDesp) { m.despesas = m.despesas.filter(o => o.id !== b.dataset.delDesp); renderAll(); persist(); return; }
  if (b.dataset.delExtra) { m.fech.extras = m.fech.extras.filter(o => o.id !== b.dataset.delExtra); renderAll(); persist(); return; }
  if (b.dataset.tipo) { find(m.despesas, b.dataset.tipo).tipo = b.dataset.v; renderAll(); persist(); return; }
});
function focusLast(sel) { const all = document.querySelectorAll(sel); all[all.length - 1]?.focus(); }

function showTab(which) {
  document.getElementById("tab-meses").setAttribute("aria-selected", which === "meses");
  document.getElementById("tab-toke").setAttribute("aria-selected", which === "toke");
  document.getElementById("view-meses").classList.toggle("hidden", which !== "meses");
  document.getElementById("view-toke").classList.toggle("hidden", which !== "toke");
}
document.getElementById("tab-meses").onclick = () => showTab("meses");
document.getElementById("tab-toke").onclick = () => { renderToke(); showTab("toke"); };

function renderAll() { renderRibbon(); renderMonth(); renderToke(); }
renderAll();
setSync("Salvo neste navegador");
connect();

/* ---------- Instalação como app (PWA) ---------- */
let deferredInstallPrompt = null;
const installBtn = document.getElementById("installApp");
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
function updateInstallButton() {
  if (!installBtn) return;
  installBtn.hidden = isStandalone();
}
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallButton();
});
installBtn?.addEventListener("click", async () => {
  if (isStandalone()) { installBtn.hidden = true; return; }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    updateInstallButton();
    return;
  }
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  alert(isiOS
    ? 'No iPhone: toque em Compartilhar e depois em “Adicionar à Tela de Início”.'
    : 'Abra este app pelo navegador e use a opção “Instalar app” ou “Adicionar à tela inicial”.');
});
window.addEventListener("appinstalled", updateInstallButton);
updateInstallButton();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
